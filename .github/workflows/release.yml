name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.100.0"
  FLUTTER_VERSION: "3.50.1"
  ANDROID_NDK_VERSION: "30.0.16248370"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  ci:
    name: ci
    # The exact CI gates (lint, tests, launch + perf, Android) on the tagged commit.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects `$/` (rhysd/actionlint#711); switch once supported
    permissions:
      contents: read

  build-desktop-and-attest:
    name: build-desktop-and-attest (${{ matrix.os }}, ${{ matrix.target }})
    needs: [ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2025
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write # OIDC token for the Sigstore build-provenance attestation
      attestations: write # store the build-provenance attestation on the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: bash .github/scripts/install-rust.sh
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Install Linux release dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Build Rust daemon and updater binaries (locked)
        shell: bash
        run: cargo build --locked --release -p bistre-daemon -p bistre-updater
      - name: Build Flutter release bundle
        working-directory: apps/bistre_app
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          if [ "$RUNNER_OS_NAME" = "Linux" ]; then
            flutter build linux --release
          else
            flutter build windows --release
          fi
      - name: Smoke-check Windows executable ProductVersion and embedded icon resource
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'apps/bistre_app/build/windows/x64/runner/Release/bistre_app.exe').Path
          $info = (Get-Item $exe).VersionInfo
          $expected = $env:RELEASE_TAG -replace '^v', ''
          $actual = ($info.ProductVersion -split '\+')[0]
          if ($actual -ne $expected) { throw "ProductVersion '$($info.ProductVersion)' does not match release tag '$env:RELEASE_TAG'" }
          if ($info.ProductName -ne 'Bistre') { throw "ProductName '$($info.ProductName)' must be 'Bistre'" }
          Add-Type -Namespace BistreSmoke -Name Shell32 -MemberDefinition '[DllImport("shell32.dll", CharSet = CharSet.Unicode)] public static extern uint ExtractIconExW(string lpszFile, int nIconIndex, System.IntPtr[] phiconLarge, System.IntPtr[] phiconSmall, uint nIcons);'
          $icons = [BistreSmoke.Shell32]::ExtractIconExW($exe, -1, $null, $null, 0)
          if ($icons -lt 1) { throw 'bistre_app.exe has no embedded icon resource' }
          Write-Output "OK: ProductVersion $($info.ProductVersion), ProductName $($info.ProductName), $icons icon(s)"
      - name: Stage and package release archive with SHA-256 checksums
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_NAME: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist stage
          if [ "$RUNNER_OS_NAME" = "Linux" ]; then
            cp -a apps/bistre_app/build/linux/x64/release/bundle/. stage/
            cp target/release/bistre-daemon target/release/bistre-updater stage/
            tar -czf "dist/bistre-${RELEASE_TAG}-${TARGET_NAME}.tar.gz" -C stage .
          else
            cp -a apps/bistre_app/build/windows/x64/runner/Release/. stage/
            cp target/release/bistre-daemon.exe target/release/bistre-updater.exe stage/
            (cd stage && 7z a "../dist/bistre-${RELEASE_TAG}-${TARGET_NAME}.zip" .)
          fi
          (cd dist && sha256sum bistre-* > "SHA256SUMS-${TARGET_NAME}.txt")
          cat "dist/SHA256SUMS-${TARGET_NAME}.txt"
      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/bistre-*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bistre-${{ matrix.target }}
          path: dist/*
          retention-days: 30

  build-android-and-attest:
    name: build-android-and-attest
    needs: [ci]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write # OIDC token for the Sigstore build-provenance attestation
      attestations: write # store the build-provenance attestation on the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Install pinned Rust toolchain
        shell: bash
        run: bash .github/scripts/install-rust.sh --target aarch64-linux-android
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Provision Android SDK API 36 and pinned NDK r30
        shell: bash
        run: bash .github/scripts/provision-android-sdk.sh
      - name: Build Android arm64-v8a direct release APK
        working-directory: apps/bistre_app
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ks_tmp=""
          trap '[ -n "$ks_tmp" ] && rm -f "$ks_tmp"' EXIT
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            ks_tmp="$(mktemp "${RUNNER_TEMP}/bistre-release-XXXXXX.jks")"
            printf '%s' "${ANDROID_KEYSTORE_B64}" | base64 -d > "$ks_tmp"
            chmod 600 "$ks_tmp"
            export ANDROID_KEYSTORE_PATH="$ks_tmp"
          fi
          bash ../../.github/scripts/with-download-retry.sh flutter pub get --enforce-lockfile
          bash ../../.github/scripts/with-download-retry.sh flutter build apk --release --target-platform android-arm64 --split-debug-info=build/debug-info
      - name: Verify 16KB ELF alignment, permissions, and package checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          src="apps/bistre_app/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$src"
          dst="dist/bistre-${RELEASE_TAG}-android-arm64.apk"
          zipalign_bin="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"
          aapt2_bin="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"

          # Spec 11 hard-fail budgets, identical to ci.yml: APK <= 32 MiB, libbistre_ffi.so <= 10 MiB.
          apk_bytes="$(stat -c %s "$src")"
          if [ "$apk_bytes" -gt $((32 * 1024 * 1024)) ]; then
            echo "ERROR: release APK exceeds 32 MiB (${apk_bytes} bytes)"
            exit 1
          fi
          so_dir="$(mktemp -d)"
          unzip -q "$src" 'lib/arm64-v8a/libbistre_ffi.so' -d "$so_dir"
          so_bytes="$(stat -c %s "${so_dir}/lib/arm64-v8a/libbistre_ffi.so")"
          rm -rf "$so_dir"
          if [ "$so_bytes" -gt $((10 * 1024 * 1024)) ]; then
            echo "ERROR: libbistre_ffi.so exceeds 10 MiB (${so_bytes} bytes)"
            exit 1
          fi
          "$zipalign_bin" -c -P 16 4 "$src"
          # Pure-Dart ELF64 PT_LOAD p_align >= 0x4000 verifier over every lib/arm64-v8a/*.so in the APK.
          dart run tools/bistre_guard/bin/bistre_guard.dart verify-elf "$src"
          if ! "$aapt2_bin" dump permissions "$src" | grep -q REQUEST_INSTALL_PACKAGES; then
            echo "ERROR: direct GitHub APK must declare REQUEST_INSTALL_PACKAGES"
            exit 1
          fi
          cp "$src" "$dst"
          (cd dist && sha256sum bistre-*.apk > SHA256SUMS-android-arm64.txt)
          cat dist/SHA256SUMS-android-arm64.txt
      - name: Attest Android release provenance (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/bistre-*.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bistre-android-arm64
          path: dist/*
          retention-days: 30

  sbom-cyclonedx:
    name: sbom-cyclonedx
    needs: [ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: bash .github/scripts/install-rust.sh
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: cargo-cyclonedx
      - name: Generate and validate CycloneDX SBOM for the shipped Rust engine (>= 50 libraries)
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --all --override-filename bistre-sbom
          sbom="$(find crates/bistre-ffi -maxdepth 1 -name 'bistre-sbom*.json' | head -n 1)"
          test -n "$sbom"
          libraries="$(jq '[.. | objects | select(.type? == "library")] | length' "$sbom")"
          echo "CycloneDX libraries listed: ${libraries}"
          if [ "$libraries" -lt 50 ]; then
            echo "ERROR: SBOM lists only ${libraries} libraries (floor 50); generation is incomplete"
            exit 1
          fi
          mkdir -p dist
          cp "$sbom" "dist/bistre-${RELEASE_TAG}-engine.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bistre-sbom
          path: dist/*
          retention-days: 30

  sign-and-publish:
    name: sign-and-publish
    if: github.ref_type == 'tag'
    needs: [build-desktop-and-attest, build-android-and-attest, sbom-cyclonedx]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Required reviewers on this environment gate every signed release.
    environment: release
    permissions:
      contents: write # create the GitHub Release and upload signed assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Build the OTA manifest and sign it with minisign (no unsigned releases)
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "ERROR: MINISIGN_SECRET_KEY is not set in the 'release' environment; refusing an unsigned release (Spec 10)."
            exit 1
          fi
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          archive="minisign-0.12-linux.tar.gz"
          bash .github/scripts/with-download-retry.sh curl -fsSL "https://github.com/jedisct1/minisign/releases/download/0.12/${archive}" -o "${tmp_dir}/${archive}"
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  ${tmp_dir}/${archive}" | sha256sum -c -
          tar -xzf "${tmp_dir}/${archive}" -C "$tmp_dir" minisign-linux/x86_64/minisign
          minisign_bin="${tmp_dir}/minisign-linux/x86_64/minisign"
          printf '%s' "${MINISIGN_SECRET_KEY}" > "${tmp_dir}/release.key"
          chmod 600 "${tmp_dir}/release.key"
          version="${RELEASE_TAG#v}"
          python3 - "$version" dist > dist/manifest.json <<'PY'
          import hashlib, json, os, sys
          version, root = sys.argv[1], sys.argv[2]
          assets = []
          for name in sorted(os.listdir(root)):
              path = os.path.join(root, name)
              if not name.startswith('bistre-') or not os.path.isfile(path):
                  continue
              h = hashlib.sha256()
              with open(path, 'rb') as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b''):
                      h.update(chunk)
              assets.append({"name": name, "sha256_hex": h.hexdigest(), "download_size_bytes": os.path.getsize(path)})
          print(json.dumps({"semver": version, "track": "track_b", "assets": assets}, indent=2))
          PY
          printf '%s\n' "${MINISIGN_PASSWORD:-}" | "$minisign_bin" -S -s "${tmp_dir}/release.key" -m dist/manifest.json -x dist/manifest.json.minisig -t "bistre ${RELEASE_TAG}"
          # Self-verify the signed OTA manifest offline against the embedded release public key (fail closed).
          pubkey="$(python3 -c "import pathlib, re; m = re.search(r'OFFICIAL_RELEASE_PUBKEY_B64[^\\\"]*\\\"([^\\\"]+)\\\"', pathlib.Path('crates/bistre-core/src/ota.rs').read_text(encoding='utf-8'), re.S); print(m.group(1) if m else '')")"
          test -n "$pubkey"
          "$minisign_bin" -V -P "$pubkey" -m dist/manifest.json -x dist/manifest.json.minisig
      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$REPO" --verify-tag --title "Bistre ${RELEASE_TAG}" --generate-notes dist/*
