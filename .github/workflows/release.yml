name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.100.0"
  FLUTTER_VERSION: "3.50.1"
  ANDROID_NDK_VERSION: "30.0.16248370"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  preflight-verify:
    name: preflight-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update --component rustfmt,clippy
          rustup default "$RUST_VERSION"
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: cargo-nextest,cargo-deny,zizmor
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Install pinned actionlint (checksum-verified)
        shell: bash
        run: bash .github/scripts/install-actionlint.sh
      - name: Run full release pre-flight verification gates
        shell: bash
        run: |
          set -euo pipefail
          actionlint
          zizmor --persona auditor .github/
          flutter pub get --enforce-lockfile
          dart run tools/bistre_guard/bin/bistre_guard.dart
          dart run tools/bistre_i18n/bin/bistre_i18n.dart check
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo deny --locked check
          cargo nextest run --locked --workspace

  build-desktop-and-attest:
    name: build-desktop-and-attest (${{ matrix.os }}, ${{ matrix.target }})
    needs: [preflight-verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2025
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write # OIDC token for the Sigstore build-provenance attestation
      attestations: write # store the build-provenance attestation on the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Install Linux release dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Build Rust daemon and updater binaries (locked)
        shell: bash
        run: cargo build --locked --release -p bistre-daemon -p bistre-updater
      - name: Build Flutter release bundle
        working-directory: apps/bistre_app
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          if [ "$RUNNER_OS_NAME" = "Linux" ]; then
            flutter build linux --release
          else
            flutter build windows --release
          fi
      - name: Smoke-check Windows executable ProductVersion and embedded icon resource
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'apps/bistre_app/build/windows/x64/runner/Release/bistre_app.exe').Path
          $info = (Get-Item $exe).VersionInfo
          $expected = $env:RELEASE_TAG -replace '^v', ''
          $actual = ($info.ProductVersion -split '\+')[0]
          if ($actual -ne $expected) { throw "ProductVersion '$($info.ProductVersion)' does not match release tag '$env:RELEASE_TAG'" }
          if ($info.ProductName -ne 'Bistre') { throw "ProductName '$($info.ProductName)' must be 'Bistre'" }
          Add-Type -Namespace BistreSmoke -Name Shell32 -MemberDefinition '[DllImport("shell32.dll", CharSet = CharSet.Unicode)] public static extern uint ExtractIconExW(string lpszFile, int nIconIndex, System.IntPtr[] phiconLarge, System.IntPtr[] phiconSmall, uint nIcons);'
          $icons = [BistreSmoke.Shell32]::ExtractIconExW($exe, -1, $null, $null, 0)
          if ($icons -lt 1) { throw 'bistre_app.exe has no embedded icon resource' }
          Write-Output "OK: ProductVersion $($info.ProductVersion), ProductName $($info.ProductName), $icons icon(s)"
      - name: Stage and package release archive with SHA-256 checksums
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_NAME: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist stage
          if [ "$RUNNER_OS_NAME" = "Linux" ]; then
            cp -a apps/bistre_app/build/linux/x64/release/bundle/. stage/
            cp target/release/bistre-daemon target/release/bistre-updater stage/
            tar -czf "dist/bistre-${RELEASE_TAG}-${TARGET_NAME}.tar.gz" -C stage .
          else
            cp -a apps/bistre_app/build/windows/x64/runner/Release/. stage/
            cp target/release/bistre-daemon.exe target/release/bistre-updater.exe stage/
            (cd stage && 7z a "../dist/bistre-${RELEASE_TAG}-${TARGET_NAME}.zip" .)
          fi
          (cd dist && sha256sum bistre-* > "SHA256SUMS-${TARGET_NAME}.txt")
          cat "dist/SHA256SUMS-${TARGET_NAME}.txt"
      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/bistre-*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bistre-${{ matrix.target }}
          path: dist/*
          retention-days: 30

  build-android-and-attest:
    name: build-android-and-attest
    needs: [preflight-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write # OIDC token for the Sigstore build-provenance attestation
      attestations: write # store the build-provenance attestation on the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update --target aarch64-linux-android
          rustup default "$RUST_VERSION"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Provision Android SDK API 36 and pinned NDK r30
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          sudo mkdir -p "${sdk_root}/ndk" "${sdk_root}/platforms" "${sdk_root}/build-tools" "${sdk_root}/licenses"
          sudo chown -R "$(id -u):$(id -g)" "$sdk_root"
          set +o pipefail
          yes | "$sdkmanager_bin" --sdk_root="$sdk_root" --licenses >/dev/null
          set -o pipefail
          bash .github/scripts/with-download-retry.sh "$sdkmanager_bin" --sdk_root="$sdk_root" --install \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          ndk_dir="${sdk_root}/ndk/${ANDROID_NDK_VERSION}"
          {
            echo "ANDROID_HOME=${sdk_root}"
            echo "ANDROID_SDK_ROOT=${sdk_root}"
            echo "ANDROID_NDK_HOME=${ndk_dir}"
          } >> "$GITHUB_ENV"
      - name: Build Android arm64-v8a direct release APK
        working-directory: apps/bistre_app
        shell: bash
        run: |
          set -euo pipefail
          bash ../../.github/scripts/with-download-retry.sh flutter pub get --enforce-lockfile
          flutter build apk --release --target-platform android-arm64
      - name: Verify 16KB ELF alignment, permissions, and package checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          src="apps/bistre_app/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$src"
          dst="dist/bistre-${RELEASE_TAG}-android-arm64.apk"
          zipalign_bin="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"
          aapt2_bin="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"

          "$zipalign_bin" -c -P 16 4 "$src"
          # Pure-Dart ELF64 PT_LOAD p_align >= 0x4000 verifier over every lib/arm64-v8a/*.so in the APK.
          dart run tools/bistre_guard/bin/bistre_guard.dart verify-elf "$src"
          if ! "$aapt2_bin" dump permissions "$src" | grep -q REQUEST_INSTALL_PACKAGES; then
            echo "ERROR: direct GitHub APK must declare REQUEST_INSTALL_PACKAGES"
            exit 1
          fi
          cp "$src" "$dst"
          (cd dist && sha256sum bistre-*.apk > SHA256SUMS-android-arm64.txt)
          cat dist/SHA256SUMS-android-arm64.txt
      - name: Attest Android release provenance (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/bistre-*.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bistre-android-arm64
          path: dist/*
          retention-days: 30

  sbom-cyclonedx:
    name: sbom-cyclonedx
    needs: [preflight-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: cargo-cyclonedx
      - name: Generate and validate CycloneDX SBOM for the shipped Rust engine (>= 50 libraries)
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --all --override-filename bistre-sbom
          sbom="$(find crates/bistre-ffi -maxdepth 1 -name 'bistre-sbom*.json' | head -n 1)"
          test -n "$sbom"
          libraries="$(jq '[.. | objects | select(.type? == "library")] | length' "$sbom")"
          echo "CycloneDX libraries listed: ${libraries}"
          if [ "$libraries" -lt 50 ]; then
            echo "ERROR: SBOM lists only ${libraries} libraries (floor 50); generation is incomplete"
            exit 1
          fi
          mkdir -p dist
          cp "$sbom" "dist/bistre-${RELEASE_TAG}-engine.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bistre-sbom
          path: dist/*
          retention-days: 30
