name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.100.0"
  FLUTTER_VERSION: "3.50.1"
  ANDROID_NDK_VERSION: "30.0.16248370"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  ci:
    name: ci
    # The exact CI gates (lint, tests, launch + perf, Android) on the tagged commit.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects `$/` (rhysd/actionlint#711); switch once supported
    permissions:
      contents: read

  build-desktop-and-attest:
    name: build-desktop-and-attest (${{ matrix.os }}, ${{ matrix.target }})
    needs: [ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            # glibc 2.31: the binaries then run everywhere the packages' libc6 (>= 2.31) floor says.
            container: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
          - os: windows-2025
            target: windows-x64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write # OIDC token for the Sigstore build-provenance attestation
      attestations: write # store the build-provenance attestation on the repository
    steps:
      # Before checkout, so checkout finds git and keeps the history SOURCE_DATE_EPOCH reads.
      - name: Install Linux release dependencies (inside the glibc 2.31 container, as root)
        if: runner.os == 'Linux'
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git unzip xz-utils zip jq file \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev rpm dpkg-dev binutils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: bash .github/scripts/install-rust.sh
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Pin archive and package timestamps to the tagged commit (SOURCE_DATE_EPOCH)
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build Rust daemon and updater binaries (locked)
        shell: bash
        env:
          # Runner paths stay out of the shipped binaries. Desktop targets have no config
          # rustflags, so this replaces nothing (Android keeps its own in the build hook).
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/bistre
        run: cargo build --locked --release -p bistre-daemon -p bistre-updater
      - name: Build Flutter release bundle
        working-directory: apps/bistre_app
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          if [ "$RUNNER_OS_NAME" = "Linux" ]; then
            flutter build linux --release
          else
            flutter build windows --release
          fi
      - name: Smoke-check Windows executable ProductVersion and embedded icon resource
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'apps/bistre_app/build/windows/x64/runner/Release/bistre_app.exe').Path
          $info = (Get-Item $exe).VersionInfo
          $expected = $env:RELEASE_TAG -replace '^v', ''
          $actual = ($info.ProductVersion -split '\+')[0]
          if ($actual -ne $expected) { throw "ProductVersion '$($info.ProductVersion)' does not match release tag '$env:RELEASE_TAG'" }
          if ($info.ProductName -ne 'Bistre') { throw "ProductName '$($info.ProductName)' must be 'Bistre'" }
          Add-Type -Namespace BistreSmoke -Name Shell32 -MemberDefinition '[DllImport("shell32.dll", CharSet = CharSet.Unicode)] public static extern uint ExtractIconExW(string lpszFile, int nIconIndex, System.IntPtr[] phiconLarge, System.IntPtr[] phiconSmall, uint nIcons);'
          $icons = [BistreSmoke.Shell32]::ExtractIconExW($exe, -1, $null, $null, 0)
          if ($icons -lt 1) { throw 'bistre_app.exe has no embedded icon resource' }
          Write-Output "OK: ProductVersion $($info.ProductVersion), ProductName $($info.ProductName), $icons icon(s)"
      - name: Stage and package release installers and archives with SHA-256 checksums
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_NAME: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist stage
          if [ "$RUNNER_OS_NAME" = "Linux" ]; then
            cp -a apps/bistre_app/build/linux/x64/release/bundle/. stage/
            cp target/release/bistre-daemon target/release/bistre-updater stage/
            # The packages promise libc6 (>= 2.31): refuse any binary that needs a newer symbol.
            newest="$(find stage -type f \( -name '*.so*' -o -perm -u+x \) -exec sh -c 'file -b "$1" | grep -q ELF && objdump -T "$1"' _ {} \; \
              | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -n 1)"
            echo "Newest glibc symbol needed: ${newest}"
            if [ -z "$newest" ] || [ "$(printf '%s\n2.31\n' "$newest" | sort -V | tail -n 1)" != "2.31" ]; then
              echo "ERROR: the Linux build needs glibc ${newest:-unknown}, above the declared 2.31 floor"
              exit 1
            fi
            bash packaging/linux/build-packages.sh "$RELEASE_TAG" stage dist
          else
            cp -a apps/bistre_app/build/windows/x64/runner/Release/. stage/
            cp target/release/bistre-daemon.exe target/release/bistre-updater.exe stage/
            (cd stage && 7z a "../dist/bistre-${RELEASE_TAG}-${TARGET_NAME}.zip" .)
            iscc_bin="$(command -v iscc || true)"
            if [ -z "$iscc_bin" ] && [ -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
              iscc_bin="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
            fi
            if [ -z "$iscc_bin" ]; then
              echo "ERROR: Inno Setup compiler (ISCC.exe) not found on Windows runner"
              exit 1
            fi
            version="${RELEASE_TAG#v}"
            stage_win="$(cygpath -w "$(pwd)/stage")"
            dist_win="$(cygpath -w "$(pwd)/dist")"
            MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL="*" "$iscc_bin" \
              "/DMyAppVersion=${version}" \
              "/DStageDir=${stage_win}" \
              "/DOutputDir=${dist_win}" \
              "/DOutputBaseFilename=bistre-${RELEASE_TAG}-${TARGET_NAME}-setup" \
              "packaging/windows/bistre.iss"
          fi
          (cd dist && sha256sum bistre-* > "sha256sums-${TARGET_NAME}.txt")
          cat "dist/sha256sums-${TARGET_NAME}.txt"
      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/bistre-*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bistre-${{ matrix.target }}
          path: dist/*
          retention-days: 30

  # The build job never sees the signing key. It builds a debug-signed intermediate that
  # only sign-android re-signs; nothing from this job is published as-is.
  build-android:
    name: build-android
    needs: [ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Install pinned Rust toolchain
        shell: bash
        run: bash .github/scripts/install-rust.sh --target aarch64-linux-android
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Provision Android SDK API 36 and pinned NDK r30
        shell: bash
        run: bash .github/scripts/provision-android-sdk.sh
      - name: Build Android arm64-v8a direct release APK
        working-directory: apps/bistre_app
        shell: bash
        env:
          # Explicit, unshipped intermediate: sign-android replaces this signature.
          BISTRE_ALLOW_DEBUG_SIGNING: "1"
        run: |
          set -euo pipefail
          bash ../../.github/scripts/with-download-retry.sh flutter pub get --enforce-lockfile
          bash ../../.github/scripts/with-download-retry.sh flutter build apk --release --target-platform android-arm64 --split-debug-info=build/debug-info
      - name: Verify 16KB ELF alignment, permissions, and budgets of the intermediate
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p unsigned
          src="apps/bistre_app/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$src"
          dst="unsigned/bistre-${RELEASE_TAG}-android-arm64.apk"
          zipalign_bin="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"
          aapt2_bin="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"

          # Spec 11 hard-fail budgets, identical to ci.yml: APK <= 32 MiB, libbistre_ffi.so <= 10 MiB.
          apk_bytes="$(stat -c %s "$src")"
          if [ "$apk_bytes" -gt $((32 * 1024 * 1024)) ]; then
            echo "ERROR: release APK exceeds 32 MiB (${apk_bytes} bytes)"
            exit 1
          fi
          so_dir="$(mktemp -d)"
          unzip -q "$src" 'lib/arm64-v8a/libbistre_ffi.so' -d "$so_dir"
          so_bytes="$(stat -c %s "${so_dir}/lib/arm64-v8a/libbistre_ffi.so")"
          rm -rf "$so_dir"
          if [ "$so_bytes" -gt $((10 * 1024 * 1024)) ]; then
            echo "ERROR: libbistre_ffi.so exceeds 10 MiB (${so_bytes} bytes)"
            exit 1
          fi
          "$zipalign_bin" -c -P 16 4 "$src"
          # Pure-Dart ELF64 PT_LOAD p_align >= 0x4000 verifier over every lib/arm64-v8a/*.so in the APK.
          dart run tools/bistre_guard/bin/bistre_guard.dart verify-elf "$src"
          if ! "$aapt2_bin" dump permissions "$src" | grep -q REQUEST_INSTALL_PACKAGES; then
            echo "ERROR: direct GitHub APK must declare REQUEST_INSTALL_PACKAGES"
            exit 1
          fi
          cp "$src" "$dst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # Not `bistre-*`, so the publish job can never pick up the intermediate.
          name: unsigned-android-arm64
          path: unsigned/*
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # Dart symbols split out of the APK (`flutter symbolize` reads them for crash reports).
          # Kept with the run, never published.
          name: symbols-android-arm64
          path: apps/bistre_app/build/debug-info/
          if-no-files-found: error
          retention-days: 90

  # The only job holding the release keystore. It signs, then refuses to continue
  # unless the APK has exactly one signer whose certificate matches the pinned fingerprint.
  sign-android:
    name: sign-android
    needs: [build-android]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC token for the Sigstore build-provenance attestation
      attestations: write # store the build-provenance attestation on the repository
    env:
      # SHA-256 of the release signing certificate (owner-generated).
      ANDROID_RELEASE_CERT_SHA256: afec66ea6157a762f4f9de7dbb78b466a9ad3ba4c70e7c95c5c870f9572e04bc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Provision Android build-tools only (apksigner)
        shell: bash
        run: bash .github/scripts/provision-android-sdk.sh --build-tools-only
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-android-arm64
          path: unsigned
      - name: Sign with the release key and verify the pinned certificate
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for var in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: ${var} is not set in the release environment; refusing to ship an unsigned or debug-signed APK"
              exit 1
            fi
          done
          ks_tmp="$(mktemp "${RUNNER_TEMP}/bistre-release-XXXXXX.jks")"
          trap 'rm -f "$ks_tmp"' EXIT
          printf '%s' "${ANDROID_KEYSTORE_B64}" | base64 -d > "$ks_tmp"
          chmod 600 "$ks_tmp"
          apksigner_bin="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          mkdir -p dist
          src="unsigned/bistre-${RELEASE_TAG}-android-arm64.apk"
          dst="dist/bistre-${RELEASE_TAG}-android-arm64.apk"
          "$apksigner_bin" sign --ks "$ks_tmp" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$dst" "$src"
          certs="$("$apksigner_bin" verify --print-certs "$dst")"
          signers="$(printf '%s\n' "$certs" | grep -c '^Signer #[0-9]* certificate SHA-256 digest:' || true)"
          digest="$(printf '%s\n' "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ' :' | tr 'A-F' 'a-f')"
          if [ "$signers" != "1" ] || [ "$digest" != "$ANDROID_RELEASE_CERT_SHA256" ]; then
            echo "ERROR: APK signer mismatch (signers=${signers}, digest=${digest})"
            exit 1
          fi
          (cd dist && sha256sum bistre-*.apk > sha256sums-android-arm64.txt)
          cat dist/sha256sums-android-arm64.txt
      - name: Attest Android release provenance (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/bistre-*.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bistre-android-arm64
          path: dist/*
          retention-days: 30
  sbom-cyclonedx:
    name: sbom-cyclonedx
    needs: [ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: bash .github/scripts/install-rust.sh
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-cyclonedx@0.5.10
      - name: Generate and validate CycloneDX SBOMs for every shipped Rust binary
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --all --override-filename bistre-sbom
          mkdir -p dist
          # crate:published-name:library-floor. The app's engine library and the background
          # engine pull the whole core; the updater only verifies and copies files.
          for shipped in bistre-ffi:engine:50 bistre-daemon:daemon:50 bistre-updater:updater:10; do
            IFS=: read -r crate name floor <<<"$shipped"
            sbom="$(find "crates/${crate}" -maxdepth 1 -name 'bistre-sbom*.json' | head -n 1)"
            if [ -z "$sbom" ]; then
              echo "ERROR: no SBOM generated for ${crate}"
              exit 1
            fi
            libraries="$(jq '[.. | objects | select(.type? == "library")] | length' "$sbom")"
            echo "CycloneDX libraries listed for ${crate}: ${libraries}"
            if [ "$libraries" -lt "$floor" ]; then
              echo "ERROR: ${crate} SBOM lists only ${libraries} libraries (floor ${floor}); generation is incomplete"
              exit 1
            fi
            cp "$sbom" "dist/bistre-${RELEASE_TAG}-${name}.cdx.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bistre-sbom
          path: dist/*
          retention-days: 30

  # Installs what users download, starts it, and removes it again, on a clean runner.
  packaging-smoke:
    name: packaging-smoke (${{ matrix.target }})
    needs: [build-desktop-and-attest]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2025
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bistre-${{ matrix.target }}
          path: dist
      - name: Install, start, and remove the .deb; start the AppImage; read the .rpm
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb rpm
          data_dir="$(mktemp -d)"
          sudo apt-get install -y ./dist/bistre-*-linux-x64.deb
          /opt/bistre/bistre-daemon --health-check --data-dir "$data_dir" | grep -q '"status_key":"diag.ok"'
          # Still running after 15 s means it started; timeout's 124 is the pass.
          set +e
          xvfb-run -a timeout 15 /usr/bin/bistre
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "ERROR: the installed app exited early (status ${status})"
            exit 1
          fi
          sudo apt-get remove -y bistre
          if [ -e /opt/bistre ] || [ -e /usr/bin/bistre ]; then
            echo "ERROR: removing the .deb left files behind"
            exit 1
          fi
          appimage="$(ls dist/bistre-*-linux-x64.AppImage)"
          chmod 0755 "$appimage"
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 15 "$appimage"
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "ERROR: the AppImage exited early (status ${status})"
            exit 1
          fi
          rpm -qp --queryformat '%{NAME} %{VERSION}\n' dist/bistre-*-linux-x64.rpm | grep -q '^bistre '
          rpm -qpl dist/bistre-*-linux-x64.rpm | grep -qx /opt/bistre/bistre_app
      - name: Install, start, and uninstall setup.exe (per-user, silent)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist -Filter 'bistre-*-windows-x64-setup.exe').FullName
          $dir = Join-Path $env:RUNNER_TEMP 'bistre-install'
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup.exe exited with $($p.ExitCode)" }
          $data = Join-Path $env:RUNNER_TEMP 'bistre-smoke-data'
          $health = & (Join-Path $dir 'bistre-daemon.exe') --health-check --data-dir $data
          if ($health -notmatch '"status_key":"diag.ok"') { throw "daemon health check failed: $health" }
          $app = Start-Process (Join-Path $dir 'bistre_app.exe') -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "the installed app exited early ($($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force
          $u = Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "the uninstaller exited with $($u.ExitCode)" }
          # The uninstaller finishes from a temporary copy; wait for it, bounded.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path (Join-Path $dir 'bistre_app.exe')) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path (Join-Path $dir 'bistre_app.exe')) { throw 'uninstalling left bistre_app.exe behind' }

  sign-and-publish:
    name: sign-and-publish
    if: github.ref_type == 'tag'
    needs: [build-desktop-and-attest, packaging-smoke, sign-android, sbom-cyclonedx]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Required reviewers on this environment gate every signed release.
    environment: release
    permissions:
      contents: write # create the GitHub Release and upload signed assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Only the release artifacts; the reusable ci job also uploads debug bundles.
          pattern: bistre-*
          path: dist
          merge-multiple: true
      - name: Install pinned Rust toolchain (OTA manifest tool)
        shell: bash
        run: bash .github/scripts/install-rust.sh
      - name: Build the OTA manifest v2 and sign it with minisign (no unsigned releases)
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "ERROR: MINISIGN_SECRET_KEY is not set in the 'release' environment; refusing an unsigned release (Spec 10)."
            exit 1
          fi
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          archive="minisign-0.12-linux.tar.gz"
          bash .github/scripts/with-download-retry.sh curl -fsSL "https://github.com/jedisct1/minisign/releases/download/0.12/${archive}" -o "${tmp_dir}/${archive}"
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  ${tmp_dir}/${archive}" | sha256sum -c -
          tar -xzf "${tmp_dir}/${archive}" -C "$tmp_dir" minisign-linux/x86_64/minisign
          minisign_bin="${tmp_dir}/minisign-linux/x86_64/minisign"
          printf '%s' "${MINISIGN_SECRET_KEY}" > "${tmp_dir}/release.key"
          chmod 600 "${tmp_dir}/release.key"
          # The manifest is written by the same Rust types the app reads (format 2:
          # one installable file per platform, pinned URLs, the SBOM never listed).
          cargo run --locked --release -p bistre-core --example ota_manifest -- build dist "$RELEASE_TAG" "$REPO"
          printf '%s\n' "${MINISIGN_PASSWORD:-}" | "$minisign_bin" -S -s "${tmp_dir}/release.key" -m dist/manifest.json -x dist/manifest.json.minisig -t "bistre ${RELEASE_TAG}"
          # Self-verify the signed OTA manifest offline against the embedded release public key (fail closed).
          pubkey="$(python3 -c "import pathlib, re; m = re.search(r'OFFICIAL_RELEASE_PUBKEY_B64[^\\\"]*\\\"([^\\\"]+)\\\"', pathlib.Path('crates/bistre-core/src/ota.rs').read_text(encoding='utf-8'), re.S); print(m.group(1) if m else '')")"
          test -n "$pubkey"
          "$minisign_bin" -V -P "$pubkey" -m dist/manifest.json -x dist/manifest.json.minisig
          # Fail closed: the app's own parser, platform selection, and every file's digest + size.
          cargo run --locked --release -p bistre-core --example ota_manifest -- verify dist "$pubkey"
      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$REPO" --verify-tag --title "Bistre ${RELEASE_TAG}" --generate-notes dist/*
