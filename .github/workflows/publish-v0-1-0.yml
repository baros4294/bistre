name: Publish v0.1.0 (Existing Artifacts)

# One-off workflow_dispatch job to sign and publish v0.1.0 from the already-built,
# Sigstore-attested release artifacts in run 45384154677 without rebuilding.
# Remove this workflow file immediately after v0.1.0 is published.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-v0-1-0
  cancel-in-progress: false

jobs:
  publish-v0-1-0:
    name: publish-v0-1-0
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # create the GitHub Release and upload signed assets
      actions: read # inspect run 45384154677 metadata and download its bistre-* artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify source run head SHA matches tag v0.1.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_RUN_ID: "45384154677"
          RELEASE_TAG: v0.1.0
        run: |
          set -euo pipefail
          run_sha="$(gh api "repos/${REPO}/actions/runs/${SOURCE_RUN_ID}" --jq '.head_sha')"
          ref_json="$(gh api "repos/${REPO}/git/ref/tags/${RELEASE_TAG}")"
          obj_type="$(printf '%s' "$ref_json" | jq -r '.object.type')"
          obj_sha="$(printf '%s' "$ref_json" | jq -r '.object.sha')"
          if [ "$obj_type" = "tag" ]; then
            tag_sha="$(gh api "repos/${REPO}/git/tags/${obj_sha}" --jq '.object.sha')"
          else
            tag_sha="$obj_sha"
          fi
          echo "Source run ${SOURCE_RUN_ID} head_sha: ${run_sha}"
          echo "Tag ${RELEASE_TAG} commit:           ${tag_sha}"
          if [ -z "$run_sha" ] || [ "$run_sha" != "$tag_sha" ]; then
            echo "ERROR: run ${SOURCE_RUN_ID} head_sha (${run_sha}) does not match tag ${RELEASE_TAG} (${tag_sha})"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: "45384154677"
          github-token: ${{ github.token }}
          pattern: bistre-*
          path: dist
          merge-multiple: true
      - name: Verify exact release artifact set and SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(find dist -mindepth 1 -maxdepth 1 ! -type f)" ]; then
            echo "ERROR: unexpected non-file entry in dist/:"
            ls -la dist
            exit 1
          fi
          bistre_count="$(find dist -maxdepth 1 -type f -name 'bistre-*' | wc -l)"
          sums_count="$(find dist -maxdepth 1 -type f -name 'SHA256SUMS-*.txt' | wc -l)"
          total_count="$(find dist -maxdepth 1 -type f | wc -l)"
          echo "Found ${bistre_count} bistre-* files, ${sums_count} SHA256SUMS-*.txt files (${total_count} total):"
          ls -la dist
          if [ "$bistre_count" -ne 4 ] || [ "$sums_count" -ne 3 ] || [ "$total_count" -ne 7 ]; then
            echo "ERROR: expected exactly 4 bistre-* files and 3 SHA256SUMS-*.txt files (7 total)"
            exit 1
          fi
          (
            cd dist
            for sums in SHA256SUMS-*.txt; do
              sha256sum -c "$sums"
            done
          )
      - name: Build the OTA manifest and sign it with minisign (no unsigned releases)
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          RELEASE_TAG: v0.1.0
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "ERROR: MINISIGN_SECRET_KEY is not set in the 'release' environment; refusing an unsigned release (Spec 10)."
            exit 1
          fi
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          archive="minisign-0.12-linux.tar.gz"
          bash .github/scripts/with-download-retry.sh curl -fsSL "https://github.com/jedisct1/minisign/releases/download/0.12/${archive}" -o "${tmp_dir}/${archive}"
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  ${tmp_dir}/${archive}" | sha256sum -c -
          tar -xzf "${tmp_dir}/${archive}" -C "$tmp_dir" minisign-linux/x86_64/minisign
          minisign_bin="${tmp_dir}/minisign-linux/x86_64/minisign"
          printf '%s' "${MINISIGN_SECRET_KEY}" > "${tmp_dir}/release.key"
          chmod 600 "${tmp_dir}/release.key"
          version="${RELEASE_TAG#v}"
          python3 - "$version" dist > dist/manifest.json <<'PY'
          import hashlib, json, os, sys
          version, root = sys.argv[1], sys.argv[2]
          assets = []
          for name in sorted(os.listdir(root)):
              path = os.path.join(root, name)
              if not name.startswith('bistre-') or not os.path.isfile(path):
                  continue
              h = hashlib.sha256()
              with open(path, 'rb') as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b''):
                      h.update(chunk)
              assets.append({"name": name, "sha256_hex": h.hexdigest(), "download_size_bytes": os.path.getsize(path)})
          print(json.dumps({"semver": version, "track": "track_b", "assets": assets}, indent=2))
          PY
          printf '%s\n' "${MINISIGN_PASSWORD:-}" | "$minisign_bin" -S -s "${tmp_dir}/release.key" -m dist/manifest.json -x dist/manifest.json.minisig -t "bistre ${RELEASE_TAG}"
          # Self-verify the signed OTA manifest offline against the embedded release public key (fail closed).
          pubkey="$(python3 -c "import pathlib, re; m = re.search(r'OFFICIAL_RELEASE_PUBKEY_B64[^\\\"]*\\\"([^\\\"]+)\\\"', pathlib.Path('crates/bistre-core/src/ota.rs').read_text(encoding='utf-8'), re.S); print(m.group(1) if m else '')")"
          test -n "$pubkey"
          "$minisign_bin" -V -P "$pubkey" -m dist/manifest.json -x dist/manifest.json.minisig
      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -maxdepth 1 -type f | sort)
          if [ "${#assets[@]}" -ne 9 ]; then
            echo "ERROR: expected exactly 9 release assets (4 bistre-* + 3 SHA256SUMS-*.txt + manifest.json + manifest.json.minisig), got ${#assets[@]}"
            exit 1
          fi
          gh release create "$RELEASE_TAG" --repo "$REPO" --verify-tag --title "Bistre ${RELEASE_TAG}" --generate-notes "${assets[@]}"
