version: 2
# Monthly, so merges and the CI runs they start stay few. Gradle is updated by hand: an update
# also needs verification-metadata.xml refreshed, which Dependabot cannot do (CONTRIBUTING).
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      pub-minor-patch:
        update-types: ["minor", "patch"]
