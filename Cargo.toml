[workspace]
resolver = "3"
members = [
  "crates/bistre-protocol",
  "crates/bistre-crypto",
  "crates/bistre-storage",
  "crates/bistre-core",
  "crates/bistre-ffi",
  "crates/bistre-daemon",
  "crates/bistre-updater",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
bistre-protocol = { path = "crates/bistre-protocol" }
bistre-crypto = { path = "crates/bistre-crypto" }
bistre-storage = { path = "crates/bistre-storage" }
bistre-core = { path = "crates/bistre-core" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util", "process"] }
rusqlite = { version = "0.43", features = ["bundled", "modern_sqlite"] }
minisign-verify = "0.3"
sha2 = "0.10"
hex = "0.4"
blake3 = "1.8"
cap-std = "4.0"
globset = "0.4"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
imara-diff = "0.2"
regex = "1.11"
tiktoken = { version = "5.1.1", default-features = false, features = ["vocab-o200k_base"] }
base64 = "0.23"
zip = { version = "9.8", default-features = false, features = ["deflate"] }
uuid = { version = "1.18", features = ["v7", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1.8", features = ["derive"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
oo7 = { version = "0.7.1", default-features = false, features = ["tokio", "native_crypto"] }
fs2 = "0.4"
libc = "0.2.191"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2", "charset", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Power",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
flutter_rust_bridge = "=2.13.0"
tempfile = "3.23"
# Test-only: property tests for parsers (Spec 02 SseFramer).
proptest = { version = "1.12", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
mem_forget = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
lossy_float_literal = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
large_futures = "warn"
rest_pat_in_fully_bound_structs = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# Cargo-native manifest hygiene (Rust 1.100 `[lints.cargo]`, verified in the 1.100 Cargo Book).
[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
redundant_homepage = "deny"

# Disk & linker-RAM containment (Spec 11 §4): line tables for Bistre crates, no debuginfo and
# optimized code for third-party dependencies. Keeps `target/` within the 5.0 GiB budget.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.release-android]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
